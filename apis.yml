aid: yourcounterpart
name: Yourcounterpart
description: >-
  Counterpart (yourcounterpart.com) is an insurtech managing general agent
  offering management and professional liability insurance for small
  businesses, positioning itself as the first Agentic Insurance system. It
  underwrites Directors & Officers, Not-For-Profit D&O, Employment Practices,
  Fiduciary, Commercial Crime, and Miscellaneous Professional Liability
  coverage, pairing AI-driven underwriting and data infrastructure with 350+
  risk-mitigation policy templates and claims management. Counterpart
  distributes through 2,800+ brokers and exposes a Quote & Bind API partner
  program that lets brokers and insurtech platforms embed instant bindable
  quotes and coverage into their own branded workflows.
